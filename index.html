<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Example</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            display: block;
        }
        
        .navbar a:hover {
            background-color: #575757;
        }
        
        .nav-links {
            display: flex;
        }
        
        .menu-icon {
            display: none;
            font-size: 28px;
            cursor: pointer;
            color: white;
        }
        
        @media screen and (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
            }
            .nav-links.active {
                display: flex;
            }
            .menu-icon {
                display: block;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="#" class="logo">MySite</a>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById("navLinks");
            nav.classList.toggle("active");
        }
    </script>

</body>

</html>
